name: Actualizar noticias

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas
  workflow_dispatch: {}        # permite correrlo a mano
  push:
    branches: [claude/daily-tech-news-html-dgcwpk]
    paths-ignore: [data.json]

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar data.json
        run: node scripts/build-feeds.mjs

      - name: Commitear si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data.json"
          else
            git commit -m "Actualizar noticias [skip ci]"
            git push
          fi
